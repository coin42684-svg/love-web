<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 My Love</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at 50% 45%,
        #5c001d 0%,
        #26000e 30%,
        #090005 70%,
        #000000 100%);

    font-family: Arial, sans-serif;
    cursor: pointer;
}

/* =========================
   NỀN SAO
========================= */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: .2;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* =========================
   TRÁI TIM 3D
========================= */

.scene {
    position: absolute;
    left: 50%;
    top: 43%;

    width: 220px;
    height: 220px;

    transform:
        translate(-50%, -50%)
        perspective(800px);

    z-index: 10;
}

.heart3d {
    position: relative;

    width: 150px;
    height: 150px;

    margin: auto;

    transform-style: preserve-3d;

    transform:
        rotateX(8deg)
        rotateY(-18deg)
        rotateZ(-45deg);

    animation:
        heartFloat 3s ease-in-out infinite,
        heartRotate 6s linear infinite;

    filter:
        drop-shadow(0 0 20px #ff003c)
        drop-shadow(0 0 60px #ff003c);
}

/* Hai nửa trái tim */

.heart3d::before,
.heart3d::after {
    content: "";

    position: absolute;

    width: 100px;
    height: 150px;

    top: 0;

    background:
        linear-gradient(
            135deg,
            #ff003c,
            #ff174f 35%,
            #b0002a 70%,
            #570013
        );

    border-radius:
        100px 100px 0 0;
}

.heart3d::before {
    left: 75px;

    transform:
        rotate(-45deg);

    transform-origin: 0 100%;
}

.heart3d::after {
    left: 0;

    transform:
        rotate(45deg);

    transform-origin: 100% 100%;
}

/* Ánh sáng trên tim */

.heart-light {
    position: absolute;

    width: 70px;
    height: 35px;

    top: 35px;
    left: 38px;

    background: rgba(255,255,255,.45);

    border-radius: 50%;

    filter: blur(12px);

    transform:
        rotate(-35deg)
        translateZ(30px);

    z-index: 5;
}

/* =========================
   ANIMATION TIM
========================= */

@keyframes heartFloat {

    0%,
    100% {
        margin-top: 0;
    }

    50% {
        margin-top: -18px;
    }
}

@keyframes heartRotate {

    0% {
        transform:
            rotateX(8deg)
            rotateY(-18deg)
            rotateZ(-45deg);
    }

    50% {
        transform:
            rotateX(-5deg)
            rotateY(18deg)
            rotateZ(-45deg);
    }

    100% {
        transform:
            rotateX(8deg)
            rotateY(-18deg)
            rotateZ(-45deg);
    }
}

/* =========================
   CHỮ
========================= */

.text {
    position: absolute;

    top: 63%;
    left: 50%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 20;

    width: 100%;
}

.text h1 {
    color: white;

    font-size:
        clamp(32px, 7vw, 65px);

    letter-spacing: 4px;

    text-shadow:
        0 0 5px white,
        0 0 15px #ff003c,
        0 0 35px #ff003c,
        0 0 70px #ff003c;

    animation: textGlow 2s infinite alternate;
}

.text p {
    margin-top: 15px;

    color: #ffb4c5;

    font-size:
        clamp(14px, 3vw, 20px);

    letter-spacing: 3px;

    text-shadow:
        0 0 10px #ff003c;
}

@keyframes textGlow {

    from {
        text-shadow:
            0 0 5px white,
            0 0 15px #ff003c;
    }

    to {
        text-shadow:
            0 0 10px white,
            0 0 30px #ff003c,
            0 0 60px #ff003c;
    }
}

/* =========================
   TIM BAY
========================= */

.flying-heart {
    position: absolute;

    bottom: -50px;

    pointer-events: none;

    font-size: var(--size);

    filter:
        drop-shadow(0 0 8px #ff003c)
        drop-shadow(0 0 20px #ff003c);

    animation:
        fly var(--time) linear forwards;
}

@keyframes fly {

    0% {
        opacity: 0;
        transform:
            translate3d(0, 0, 0)
            scale(.3)
            rotate(0deg);
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
            translate3d(
                var(--x),
                -55vh,
                100px
            )
            scale(1)
            rotate(180deg);
    }

    100% {
        opacity: 0;

        transform:
            translate3d(
                var(--x2),
                -120vh,
                200px
            )
            scale(.5)
            rotate(360deg);
    }
}

/* =========================
   CLICK PARTICLES
========================= */

.particle {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff174f;

    box-shadow:
        0 0 10px #ff174f,
        0 0 25px #ff003c;

    pointer-events: none;

    animation:
        explode 1s ease-out forwards;
}

@keyframes explode {

    0% {
        opacity: 1;

        transform:
            translate(0, 0)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                var(--px),
                var(--py)
            )
            scale(0);
    }
}

/* =========================
   HƯỚNG DẪN
========================= */

.hint {
    position: absolute;

    bottom: 25px;

    width: 100%;

    text-align: center;

    color: #ffffff88;

    font-size: 13px;

    letter-spacing: 2px;
}
</style>
</head>

<body>

<!-- Sao nền -->
<div class="stars" id="stars"></div>


<!-- Tim 3D -->
<div class="scene">

    <div class="heart3d">

        <div class="heart-light"></div>

    </div>

</div>


<!-- Chữ -->
<div class="text">

    <h1>Made with Love ❤️</h1>

    <p>Chạm vào màn hình ✨</p>

</div>


<div class="hint">
    CLICK / CHẠM ĐỂ TẠO PHÁO HOA ❤️
</div>


<script>

/* =========================
   TẠO SAO
========================= */

const stars =
    document.getElementById("stars");

for (let i = 0; i < 100; i++) {

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 2 + "s";

    star.style.opacity =
        Math.random();

    document
        .getElementById("stars")
        .appendChild(star);
}


/* =========================
   TIM BAY
========================= */

const heartTypes = [
    "❤️",
    "💖",
    "💕",
    "💗",
    "💓",
    "💘",
    "💝",
    "💞"
];

function createHeart(x) {

    const heart =
        document.createElement("div");

    heart.className =
        "flying-heart";

    heart.innerHTML =
        heartTypes[
            Math.floor(
                Math.random() *
                heartTypes.length
            )
        ];

    heart.style.left =
        (x ?? Math.random() *
        window.innerWidth) + "px";

    heart.style.setProperty(
        "--size",
        15 + Math.random() * 35 + "px"
    );

    heart.style.setProperty(
        "--time",
        4 + Math.random() * 5 + "s"
    );

    heart.style.setProperty(
        "--x",
        -150 + Math.random() * 300 + "px"
    );

    heart.style.setProperty(
        "--x2",
        -300 + Math.random() * 600 + "px"
    );

    document.body.appendChild(heart);

    setTimeout(() => {

        heart.remove();

    }, 10000);
}


/* Tim bay liên tục */

setInterval(() => {

    createHeart();

}, 350);


/* =========================
   PHÁO HOA CLICK
========================= */

function explosion(x, y) {

    for (let i = 0; i < 35; i++) {

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.style.left =
            x + "px";

        particle.style.top =
            y + "px";

        const angle =
            Math.random() *
            Math.PI * 2;

        const distance =
            50 + Math.random() * 180;

        particle.style.setProperty(
            "--px",
            Math.cos(angle) *
            distance + "px"
        );

        particle.style.setProperty(
            "--py",
            Math.sin(angle) *
            distance + "px"
        );

        document.body
            .appendChild(particle);

        setTimeout(() => {

            particle.remove();

        }, 1000);
    }


    /* Thêm tim */

    for (let i = 0; i < 12; i++) {

        createHeart(
            x - 80 +
            Math.random() * 160
        );

    }
}


/* PC */

document.addEventListener(
    "click",
    event => {

        explosion(
            event.clientX,
            event.clientY
        );

    }
);


/* Điện thoại */

document.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.touches[0];

        explosion(
            touch.clientX,
            touch.clientY
        );

    },
    { passive: true }
);

</script>

</body>
</html>
